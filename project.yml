name: StreamBox
options:
  bundleIdPrefix: com.mauro
  deploymentTarget:
    tvOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  AetherEngine:
    url: https://github.com/superuser404notfound/AetherEngine
    from: 7.66.1
targets:
  StreamBox:
    type: application
    platform: tvOS
    sources: [Sources]
    dependencies:
      - package: AetherEngine
        product: AetherEngine
    scheme: {}
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: StreamBox
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          # Many IPTV providers only serve plain http
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mauro.streambox
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: NO
