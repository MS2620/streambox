name: StreamBox
options:
  bundleIdPrefix: com.mauro
  deploymentTarget:
    tvOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Filled by GitHub Actions from the TRAKT_CLIENT_ID secret; empty means "enter your own".
    TRAKT_CLIENT_ID: ""
    # Filled by GitHub Actions from the TMDB_TOKEN secret; empty means "enter your own".
    TMDB_TOKEN: ""
packages:
  AetherEngine:
    url: https://github.com/superuser404notfound/AetherEngine
    from: 7.66.1
targets:
  StreamBox:
    type: application
    platform: tvOS
    sources: [Sources, Resources, Shared]
    dependencies:
      - package: AetherEngine
        product: AetherEngine
      # Top Shelf: Continue Watching and live games on the Apple TV home screen
      - target: StreamBoxTopShelf
    scheme: {}
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Tellio
        # Without these the generator writes a fixed "1.0 (1)"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TraktClientID: $(TRAKT_CLIENT_ID)
        TMDBToken: $(TMDB_TOKEN)
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          # Many IPTV providers only serve plain http
          NSAllowsArbitraryLoads: true
        # Top Shelf cards open streambox:// links
        CFBundleURLTypes:
          - CFBundleURLName: com.mauro.streambox
            CFBundleURLSchemes: [streambox]
    entitlements:
      path: Config/StreamBox.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mauro.streambox]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mauro.streambox
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        GENERATE_INFOPLIST_FILE: NO

  StreamBoxTopShelf:
    type: app-extension
    platform: tvOS
    sources: [TopShelf, Shared]
    info:
      path: Config/TopShelf-Info.plist
      properties:
        CFBundleDisplayName: Tellio Top Shelf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    entitlements:
      path: Config/StreamBoxTopShelf.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mauro.streambox]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mauro.streambox.topshelf
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: NO
